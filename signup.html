<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — StageMatch</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="supabase-client.js" defer></script><script src="supabase-shop.js" defer></script><script src="auth-ui.js" defer></script><script src="script.js" defer></script></head><body><main class="section container"><section class="form-card"><a href="index.html">StageMatch</a><h1>Créer un compte étudiant</h1><form id="signup-form" class="form-grid"><div class="field"><label for="first">Prénom</label><input id="first" name="first" autocomplete="given-name" required></div><div class="field"><label for="last">Nom</label><input id="last" name="last" autocomplete="family-name" required></div><div class="field full"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field full"><label for="password">Mot de passe (8 caractères minimum)</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field full"><label for="confirm">Confirmer le mot de passe</label><input id="confirm" name="confirm" type="password" minlength="8" autocomplete="new-password" required></div><div class="field full"><button class="button button-primary" type="submit">Créer le compte</button><p class="form-message" role="status"></p></div></form><p><a href="login.html">Connexion</a> · <a href="index.html">Accueil</a></p></section></main></body></html>
