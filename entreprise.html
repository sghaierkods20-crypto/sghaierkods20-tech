<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace entreprise — StageMatch</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="supabase-client.js" defer></script><script src="supabase-shop.js" defer></script><script src="auth-ui.js" defer></script><script src="script.js" defer></script></head><body><main class="section container"><p><a class="button button-secondary" href="index.html">← Retour accueil</a></p><section class="form-card" id="employer-page"><h1>Espace entreprise</h1><p id="employer-status" role="status">Vérification de l’accès…</p><h2>Publier une offre</h2><form id="offer-form" class="form-grid"><div class="field"><label>Titre<input name="title" minlength="4" required></label></div><div class="field"><label>Entreprise<input name="company_name" required></label></div><div class="field"><label>Ville<input name="city" required></label></div><div class="field"><label>Spécialité<input name="specialty" required></label></div><div class="field"><label>Période<input name="period"></label></div><div class="field"><label>Durée<input name="duration"></label></div><div class="field full"><label>Compétences séparées par virgules<input name="skills"></label></div><div class="field full"><label>Description<textarea name="description" required rows="5"></textarea></label></div><label><input name="is_published" type="checkbox"> Publier maintenant</label><div class="field full"><button class="button button-primary">Enregistrer</button></div></form><h2>Candidatures reçues</h2><div id="employer-applications"></div><a href="index.html">Accueil</a></section></main></body></html>
